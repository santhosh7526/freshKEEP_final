name: Upload Appium Test Cases

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload-appium-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Appium Test Cases
        uses: actions/upload-artifact@v4
        with:
          name: Appium Test Cases
          path: test_cases/appium_test_cases.xlsx
