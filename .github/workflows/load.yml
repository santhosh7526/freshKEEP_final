name: Upload Load Test Cases

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload-load-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Load Test Cases
        uses: actions/upload-artifact@v4
        with:
          name: Load Test Cases
          path: test_cases/load_test_cases.xlsx
