name: Upload Selenium Test Cases

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload-selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Selenium Test Cases
        uses: actions/upload-artifact@v4
        with:
          name: Selenium Test Cases
          path: test_cases/selenium_test_cases.xlsx
