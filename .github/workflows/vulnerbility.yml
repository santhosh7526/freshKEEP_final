name: Upload Vulnerability Test Cases

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload-vulnerability-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Vulnerability Test Cases
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability Test Cases
          path: test_cases/vulnerability_test_cases.xlsx
